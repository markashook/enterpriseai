# LiteLLM Configuration Template for EnterpriseAI
# Rendered from this template during install. Do not edit this file directly on workstations.
# See C:\ProgramData\EnterpriseAI\Config\litellm.config.yaml for the active configuration.
#
# TODO: Verify LiteLLM config schema against the installed LiteLLM version before production deployment.
# Reference: https://docs.litellm.ai/docs/proxy/configs

general_settings:
  # Require an API key for all requests. Do NOT set to false in production.
  master_key: "os.environ/LITELLM_MASTER_KEY"

  # Bind only to loopback. Do NOT change to 0.0.0.0 or a LAN address.
  host: "127.0.0.1"
  port: 4000

  # Disable debug mode in production to avoid leaking sensitive information
  debug: false

  # Disable telemetry
  telemetry: false

  # Drop unknown model names (do not forward to any provider)
  drop_params: false

litellm_settings:
  # Do not allow runtime model pulls by default.
  # This value is overridden if RuntimeModelPullsEnabled is true in enterpriseai.package.json.
  # TODO: Verify the correct LiteLLM setting to disable/enable runtime pulls.
  set_verbose: false

model_list:
  # Approved model aliases. Only these aliases are accessible by users.
  # Add or remove aliases by editing config/approved-models.example.json and re-running install/repair.
  # TODO: Populate this list from the active approved-models.json during config rendering.
  - model_name: "approved-chat"
    litellm_params:
      model: "ollama_chat/approved-chat-model"
      api_base: "http://127.0.0.2:11434"
    # Require auth for all models
    model_info:
      require_auth: true

  - model_name: "approved-code"
    litellm_params:
      model: "ollama_chat/approved-code-model"
      api_base: "http://127.0.0.2:11434"
    model_info:
      require_auth: true

router_settings:
  # Route only to defined model aliases; reject unknown models
  routing_strategy: "simple-shuffle"
  allowed_fails: 0

# Environment variables expected at runtime (injected by service wrapper or environment):
#   LITELLM_MASTER_KEY  - API key for authentication (stored in C:\ProgramData\EnterpriseAI\Secrets)
#   OLLAMA_ENDPOINT     - Ollama backend URL (http://127.0.0.2:11434)
