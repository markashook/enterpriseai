name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate PowerShell syntax
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $failed = @()

          $psFiles = Get-ChildItem -Path . -Recurse -Include '*.ps1','*.psm1','*.psd1' |
            Where-Object { $_.FullName -notmatch '\\\.git\\' }

          Write-Host "Checking $($psFiles.Count) PowerShell files..."

          foreach ($file in $psFiles) {
            try {
              $null = [System.Management.Automation.Language.Parser]::ParseFile(
                $file.FullName, [ref]$null, [ref]$null
              )
              Write-Host "  PASS: $($file.FullName)"
            } catch {
              Write-Host "  FAIL: $($file.FullName) - $($_.Exception.Message)"
              $failed += $file.FullName
            }
          }

          if ($failed.Count -gt 0) {
            Write-Host "PowerShell syntax errors found in $($failed.Count) file(s)."
            exit 1
          }
          Write-Host "All PowerShell files passed syntax check."

      - name: Install PSScriptAnalyzer
        shell: powershell
        run: |
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
            Write-Host "Installing PSScriptAnalyzer..."
            Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck
          } else {
            Write-Host "PSScriptAnalyzer already installed."
          }

      - name: Run PSScriptAnalyzer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module PSScriptAnalyzer -ErrorAction Stop

          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error,Warning `
            -ExcludeRule PSAvoidUsingWriteHost,PSUseShouldProcessForStateChangingFunctions `
            -ErrorAction SilentlyContinue

          if ($results) {
            $results | Format-Table -AutoSize
            $errors = $results | Where-Object { $_.Severity -eq 'Error' }
            if ($errors) {
              Write-Host "PSScriptAnalyzer found $($errors.Count) error(s)."
              exit 1
            }
            Write-Host "PSScriptAnalyzer: warnings found but no errors."
          } else {
            Write-Host "PSScriptAnalyzer: no issues found."
          }

      - name: Validate JSON configuration files
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $failed = @()

          $jsonFiles = Get-ChildItem -Path . -Recurse -Include '*.json' |
            Where-Object { $_.FullName -notmatch '\\\.git\\' }

          Write-Host "Checking $($jsonFiles.Count) JSON files..."

          foreach ($file in $jsonFiles) {
            try {
              $content = Get-Content $file.FullName -Raw
              $null = $content | ConvertFrom-Json
              Write-Host "  PASS: $($file.FullName)"
            } catch {
              Write-Host "  FAIL: $($file.FullName) - $($_.Exception.Message)"
              $failed += $file.FullName
            }
          }

          if ($failed.Count -gt 0) {
            Write-Host "JSON validation failed for $($failed.Count) file(s)."
            exit 1
          }
          Write-Host "All JSON files are valid."

      - name: Validate YAML configuration files
        shell: powershell
        run: |
          # Install powershell-yaml if available; skip if not
          try {
            if (-not (Get-Module -ListAvailable -Name powershell-yaml)) {
              Install-Module -Name powershell-yaml -Force -Scope CurrentUser -SkipPublisherCheck -ErrorAction SilentlyContinue
            }
            Import-Module powershell-yaml -ErrorAction Stop

            $yamlFiles = Get-ChildItem -Path . -Recurse -Include '*.yml','*.yaml' |
              Where-Object { $_.FullName -notmatch '\\\.git\\' }

            $failed = @()
            foreach ($file in $yamlFiles) {
              try {
                $null = Get-Content $file.FullName -Raw | ConvertFrom-Yaml
                Write-Host "  PASS: $($file.FullName)"
              } catch {
                Write-Host "  FAIL: $($file.FullName) - $($_.Exception.Message)"
                $failed += $file.FullName
              }
            }

            if ($failed.Count -gt 0) {
              Write-Host "YAML validation failed for $($failed.Count) file(s)."
              exit 1
            }
          } catch {
            Write-Host "powershell-yaml not available, skipping YAML validation: $($_.Exception.Message)"
          }

      - name: Check default endpoints are loopback-only
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $config = Get-Content 'config\enterpriseai.package.json' -Raw | ConvertFrom-Json
          $failed = $false

          $litellmEndpoint = $config.LiteLLMEndpoint
          $ollamaEndpoint = $config.OllamaEndpoint

          # LiteLLM must bind to 127.0.0.1
          if ($litellmEndpoint -notmatch '^http://127\.') {
            Write-Host "FAIL: LiteLLMEndpoint '$litellmEndpoint' is not loopback-only (must match 127.x.x.x)"
            $failed = $true
          } else {
            Write-Host "PASS: LiteLLMEndpoint is loopback: $litellmEndpoint"
          }

          # Ollama must bind to 127.x.x.x
          if ($ollamaEndpoint -notmatch '^http://127\.') {
            Write-Host "FAIL: OllamaEndpoint '$ollamaEndpoint' is not loopback-only (must match 127.x.x.x)"
            $failed = $true
          } else {
            Write-Host "PASS: OllamaEndpoint is loopback: $ollamaEndpoint"
          }

          # RuntimeModelPullsEnabled must be false by default
          if ($config.RuntimeModelPullsEnabled -ne $false) {
            Write-Host "FAIL: RuntimeModelPullsEnabled must default to false"
            $failed = $true
          } else {
            Write-Host "PASS: RuntimeModelPullsEnabled is false"
          }

          # RequireLiteLLMApiKey must be true by default
          if ($config.RequireLiteLLMApiKey -ne $true) {
            Write-Host "FAIL: RequireLiteLLMApiKey must default to true"
            $failed = $true
          } else {
            Write-Host "PASS: RequireLiteLLMApiKey is true"
          }

          if ($failed) { exit 1 }

      - name: Check firewall rule names use EnterpriseAI- prefix
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $firewallPolicy = Get-Content 'config\firewall.policy.json' -Raw | ConvertFrom-Json
          $failed = $false

          foreach ($rule in $firewallPolicy.Rules) {
            if ($rule.Name -notlike 'EnterpriseAI-*') {
              Write-Host "FAIL: Firewall rule '$($rule.Name)' does not start with 'EnterpriseAI-'"
              $failed = $true
            } else {
              Write-Host "PASS: $($rule.Name)"
            }
          }

          if ($failed) { exit 1 }

      - name: Check scripts do not perform install-time upstream downloads
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # Check that install/repair scripts do not contain Invoke-WebRequest or WebClient download calls
          # (these should only be in packaging scripts)
          $installScripts = @(
            'scripts\Install-EnterpriseAI.ps1',
            'scripts\Repair-EnterpriseAI.ps1',
            'scripts\Uninstall-EnterpriseAI.ps1'
          )

          $downloadPatterns = @(
            'Invoke-WebRequest',
            'WebClient',
            'Start-BitsTransfer',
            'curl\.exe',
            'wget\.exe'
          )

          $failed = $false
          foreach ($scriptPath in $installScripts) {
            if (-not (Test-Path $scriptPath)) {
              Write-Host "WARN: Script not found: $scriptPath"
              continue
            }
            $content = Get-Content $scriptPath -Raw
            foreach ($pattern in $downloadPatterns) {
              # Exclude lines that are comments
              $lines = $content -split "`n" | Where-Object { $_ -notmatch '^\s*#' }
              $matchingLines = $lines | Where-Object { $_ -match $pattern }
              if ($matchingLines) {
                Write-Host "FAIL: $scriptPath contains download pattern '$pattern' in non-comment lines"
                $matchingLines | ForEach-Object { Write-Host "  > $_" }
                $failed = $true
              }
            }
            Write-Host "PASS: $scriptPath has no prohibited download patterns"
          }

          if ($failed) { exit 1 }

  pester:
    name: Pester Tests
    runs-on: windows-latest
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Pester
        shell: powershell
        run: |
          if (-not (Get-Module -ListAvailable -Name Pester | Where-Object { $_.Version -ge '5.0' })) {
            Write-Host "Installing Pester 5.x..."
            Install-Module -Name Pester -MinimumVersion 5.0 -Force -Scope CurrentUser -SkipPublisherCheck
          } else {
            Write-Host "Pester 5.x already installed."
          }

      - name: Run Pester tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module Pester -MinimumVersion 5.0

          $pesterConfig = New-PesterConfiguration
          $pesterConfig.Run.Path = 'tests\Pester'
          $pesterConfig.Output.Verbosity = 'Detailed'
          $pesterConfig.TestResult.Enabled = $true
          $pesterConfig.TestResult.OutputPath = 'test-results.xml'
          $pesterConfig.TestResult.OutputFormat = 'NUnitXml'
          $pesterConfig.Run.PassThru = $true

          $result = Invoke-Pester -Configuration $pesterConfig

          if ($result.FailedCount -gt 0) {
            Write-Host "$($result.FailedCount) Pester test(s) failed."
            exit 1
          }
          Write-Host "All $($result.PassedCount) Pester test(s) passed."
        continue-on-error: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-test-results
          path: test-results.xml
          if-no-files-found: ignore
